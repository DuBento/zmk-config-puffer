layout: {zmk_keyboard: puffer}
layers:
  Qwerty:
  - [Q, W, E, R, T, Y, U, I, O, P]
  - - {t: A, h: LALT}
    - {t: S, h: LGUI}
    - {t: D, h: LCTRL}
    - {t: F, h: LSHFT}
    - G
    - H
    - {t: J, h: RSHFT}
    - {t: K, h: RCTRL}
    - {t: L, h: RGUI}
    - {t: ;, h: RALT, s: ':'}
  - - Z
    - X
    - C
    - V
    - B
    - N
    - M
    - {t: ',', s: '"'}
    - {t: ., s: ''''}
    - {t: /, s: '?'}
  - - {t: ESC, h: LGUI, s: '~'}
    - {t: TAB, h: LCTRL}
    - {t: SPACE, h: Numpad, s: TAB}
    - {t: BSPC, h: Nav}
    - {t: ENTER, h: RSHFT}
    - {t: DEL, h: RALT, s: '&caps_word'}
  Numpad:
  - ['!', '@', '#', $, '%', ^, '&', KP MULTIPLY, (, )]
  - - {t: '1', h: LALT}
    - {t: '2', h: LGUI}
    - {t: '3', h: LCTRL}
    - {t: '4', h: LSHFT}
    - '5'
    - '6'
    - {t: '7', h: RSHFT}
    - {t: '8', h: RCTRL}
    - {t: '9', h: RGUI}
    - {t: '0', h: LALT}
  - ['`', '~', '-', '=', _, +, <, '>', \, '|']
  - - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {type: held}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
  Nav:
  - [ESC, Ctl+PG UP, Ctl+PG DN, '', '', VOL UP, HOME, UP, END, PG UP]
  - [LALT, LGUI, LCTRL, LSHFT, '&key_repeat', VOL DN, LEFT, DOWN, RIGHT, PG DN]
  - ['', '', '', '', '', MUTE, PP, PREV, NEXT, '']
  - - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {type: held}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
  System:
  - - {t: BT, h: '0'}
    - {t: BT, h: '1'}
    - {t: BT, h: '2'}
    - {t: BT, h: '3'}
    - {t: BT, h: '4'}
    - BRI INC
    - F7
    - F8
    - F9
    - F12
  - [LALT, LGUI, LCTRL, LSHFT, '', BRI DEC, F4, F5, F6, F11]
  - - BT CLR
    - BOOT
    - {t: Mac, h: toggle}
    - ''
    - ''
    - ''
    - F1
    - F2
    - F3
    - F10
  - - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {type: held}
    - {type: held}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
  Mac:
  - - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
  - - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
  - - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
  - - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
combos:
- p: [6, 7]
  k: '{'
  l: [Qwerty, Mac]
- p: [7, 8]
  k: '}'
  l: [Qwerty, Mac]
- p: [16, 17]
  k: (
  l: [Qwerty, Mac]
- p: [17, 18]
  k: )
  l: [Qwerty, Mac]
- p: [26, 27]
  k: '['
  l: [Qwerty, Mac]
- p: [27, 28]
  k: ']'
  l: [Qwerty, Mac]
- p: [1, 2]
  k: <
  l: [Qwerty, Mac]
- p: [2, 3]
  k: '>'
  l: [Qwerty, Mac]
- p: [11, 12]
  k: _
  l: [Qwerty, Mac]
- p: [12, 13]
  k: '='
  l: [Qwerty, Mac]
- p: [21, 22]
  k: '-'
  l: [Qwerty, Mac]
- p: [22, 23]
  k: +
  l: [Qwerty, Mac]
- p: [15, 16]
  k: ''''
  l: [Qwerty, Mac]
- p: [11, 16]
  k: '&caps_word'
  l: [Qwerty, Mac]
- p: [12, 2]
  k: Ctl+C
  l: [Qwerty]
- p: [12, 2]
  k: Gui+C
  l: [Mac]
- p: [13, 3]
  k: Ctl+V
  l: [Qwerty]
- p: [13, 3]
  k: Gui+V
  l: [Mac]
- p: [13, 23]
  k: Ctl+X
  l: [Qwerty]
- p: [13, 23]
  k: Gui+X
  l: [Mac]
- p: [14, 24]
  k: Ctl+Z
  l: [Qwerty]
- p: [14, 24]
  k: Gui+Z
  l: [Mac]
